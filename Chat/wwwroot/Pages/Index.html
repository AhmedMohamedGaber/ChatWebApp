<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatHub - Premium Nexus</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="/lib/signalr/dist/browser/signalr.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --secondary: #a855f7;
            --dark: #030712;
            --surface: #0f172a;
            --glass: rgba(15, 23, 42, 0.75);
            --text: #f9fafb;
            --text-muted: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top left, #1e1b4b, #030712);
            color: var(--text);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Modal Overlays - Robust Hidden State */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            pointer-events: auto;
        }

        .modal-overlay.active {
            display: flex !important;
        }

        .modal {
            background: var(--surface);
            padding: 3rem;
            border-radius: 40px;
            width: 90%;
            max-width: 450px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 50px 150px rgba(0, 0, 0, 1);
            position: relative;
        }

        .modal h2 {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 2rem;
            background: linear-gradient(135deg, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .modal input {
            width: 100%;
            padding: 1.4rem 1.8rem;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            color: white;
            margin-bottom: 2rem;
            font-size: 1.1rem;
            outline: none;
            transition: 0.3s;
        }

        .modal input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 30px var(--primary-glow);
        }

        .btn-action {
            width: 100%;
            padding: 1.3rem;
            background: var(--primary);
            border: none;
            border-radius: 20px;
            color: white;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1.1rem;
        }

        .btn-action:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px var(--primary-glow);
            filter: brightness(1.1);
        }

        /* App Main UI */
        .app-container {
            width: 1200px;
            height: 85vh;
            background: var(--glass);
            backdrop-filter: blur(30px);
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            z-index: 10;
        }

        .app-header {
            padding: 1.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .user-meta {
            display: flex;
            align-items: center;
            gap: 1.2rem;
        }

        .u-avatar {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.35rem;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .chat-stream {
            flex: 1;
            padding: 3rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
            scroll-behavior: smooth;
        }

        .bubble {
            max-width: 70%;
            padding: 1.3rem 1.95rem;
            border-radius: 28px;
            animation: enter 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        @keyframes enter {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.9);
            }
        }

        .bubble.sent {
            align-self: flex-end;
            background: var(--primary);
            border-bottom-right-radius: 4px;
            box-shadow: 0 10px 30px var(--primary-glow);
        }

        .bubble.received {
            align-self: flex-start;
            background: var(--surface);
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .input-region {
            padding: 2.5rem 3.5rem;
            display: flex;
            gap: 1.2rem;
            background: rgba(0, 0, 0, 0.25);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 20;
        }

        .input-region input {
            flex: 1;
            padding: 1.5rem 2rem;
            background: var(--surface);
            border: 2px solid rgba(255, 255, 255, 0.05);
            border-radius: 25px;
            color: white;
            font-size: 1.1rem;
            transition: 0.3s;
            outline: none;
            pointer-events: auto !important;
            position: relative;
            z-index: 30;
        }

        .input-region input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 40px var(--primary-glow);
        }

        .btn-send {
            padding: 0 3.5rem;
            background: var(--primary);
            border: none;
            border-radius: 25px;
            color: white;
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
        }

        .btn-send:hover {
            transform: scale(1.05);
            filter: brightness(1.2);
            box-shadow: 0 0 30px var(--primary-glow);
        }
    </style>
</head>

<body>
    <!-- Identity Overlay -->
    <div class="modal-overlay" id="preflightModal">
        <div class="modal">
            <h2>Access Registry</h2>
            <p style="color: var(--text-muted); margin-bottom: 2rem; font-weight: 500;">Please identify yourself to
                synchronize with the nexus.</p>
            <input type="text" id="preName" placeholder="Visual Handle..." maxlength="20">
            <button class="btn-action" onclick="nexus.start()">ESTABLISH LINK</button>
        </div>
    </div>

    <div class="app-container">
        <header class="app-header">
            <div class="user-meta">
                <div class="u-avatar" id="dispAvatar">?</div>
                <div>
                    <div id="dispName" style="font-weight: 900; font-size: 1.15rem;">Subject Unknown</div>
                    <div
                        style="font-size: 0.75rem; color: #10b981; font-weight: 800; display: flex; align-items: center; gap: 0.4rem;">
                        <span
                            style="width: 7px; height: 7px; background:#10b981; border-radius:50%; box-shadow:0 0 10px #10b981;"></span>
                        NEXUS SYNCED
                    </div>
                </div>
            </div>

            <nav style="display: flex; gap: 1.5rem; align-items: center;">
                <a href="SpecialChat.html"
                    style="text-decoration: none; color: white; font-weight: 800; font-size: 0.95rem; opacity: 0.8; transition: 0.3s;">GROUPS</a>
                <a href="Landing.html"
                    style="text-decoration: none; background: rgba(255,255,255,0.05); padding: 0.7rem 1.4rem; border-radius: 12px; color: white; font-weight: 900; font-size: 0.9rem;">HOME
                    &rarr;</a>
            </nav>
        </header>

        <main class="chat-stream" id="streamArea"></main>

        <footer class="input-region">
            <input type="text" id="pulseInput" placeholder="Pulse a message to the hub..." autocomplete="off">
            <button class="btn-send" onclick="nexus.pulse()">PULSE</button>
        </footer>
    </div>

    <script>
        class NexusLogic {
            constructor() {
                this.conn = null;
                this.user = localStorage.getItem('chatUsername') || '';
                this.init();
            }

            init() {
                if (!this.user) {
                    this.toggleModal('preflightModal', true);
                    document.getElementById('preName').focus();
                } else {
                    this.updateUI();
                    this.connect();
                }
                // Key Bindings
                document.getElementById('pulseInput').addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') this.pulse();
                });
                document.getElementById('preName').addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') this.start();
                });
            }

            toggleModal(id, show) {
                const el = document.getElementById(id);
                if (el) {
                    el.classList.toggle('active', show);
                    // Critical: if hiding, clear focus to allow interface interaction
                    if (!show) document.activeElement.blur();
                }
            }

            start() {
                const val = document.getElementById('preName').value.trim();
                if (!val) return;
                this.user = val;
                localStorage.setItem('chatUsername', val);
                this.updateUI();
                this.toggleModal('preflightModal', false);
                this.connect();
                // Forced focus on main input after modal close
                setTimeout(() => document.getElementById('pulseInput').focus(), 100);
            }

            updateUI() {
                document.getElementById('dispName').textContent = this.user;
                document.getElementById('dispAvatar').textContent = this.user ? this.user[0].toUpperCase() : '?';
            }

            connect() {
                this.conn = new signalR.HubConnectionBuilder()
                    .withUrl("/chat")
                    .withAutomaticReconnect()
                    .build();

                this.conn.on("ReceiveMessage", (u, m) => this.draw(u, m, u === this.user));

                this.conn.start()
                    .then(() => this.conn.invoke("RegisterUser", this.user))
                    .catch(e => console.error("Nexus Synchronizer Error:", e));
            }

            pulse() {
                const el = document.getElementById('pulseInput');
                const val = el.value.trim();
                if (!val || !this.conn || this.conn.state !== 'Connected') return;

                this.conn.invoke("Send", this.user, val);
                el.value = '';
                el.focus();
            }

            draw(u, m, isMe) {
                const area = document.getElementById('streamArea');
                const html = `
                    <div class="bubble ${isMe ? 'sent' : 'received'}">
                        ${!isMe ? `<div style="font-size:0.8rem; font-weight:900; color:var(--primary); margin-bottom:0.4rem; opacity:0.9;">${u}</div>` : ''}
                        <div style="word-break: break-word;">${m}</div>
                    </div>
                `;
                area.insertAdjacentHTML('beforeend', html);
                area.scrollTop = area.scrollHeight;
            }
        }
        window.nexus = new NexusLogic();
    </script>
</body>

</html>
