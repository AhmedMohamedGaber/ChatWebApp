<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatHub | Premium Discovery</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <script src="/lib/signalr/dist/browser/signalr.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --secondary: #a855f7;
            --dark: #030712;
            --surface: #0f172a;
            --glass: rgba(15, 23, 42, 0.85);
            --text: #f9fafb;
            --text-muted: #9ca3af;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top left, #1e1b4b, #030712);
            color: var(--text);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Modal Overlays */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            pointer-events: auto;
        }

        .modal-overlay.active {
            display: flex !important;
        }

        .modal {
            background: var(--surface);
            padding: 3rem;
            border-radius: 40px;
            width: 90%;
            max-width: 450px;
            border: 1px solid var(--border);
            box-shadow: 0 50px 150px rgba(0, 0, 0, 1);
        }

        .modal h2 {
            font-size: 2.2rem;
            font-weight: 950;
            margin-bottom: 2rem;
        }

        .modal input {
            width: 100%;
            padding: 1.2rem 1.6rem;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid var(--border);
            border-radius: 20px;
            color: white;
            margin-bottom: 1.5rem;
            outline: none;
            font-size: 1rem;
        }

        .modal input:focus {
            border-color: var(--primary);
        }

        .btn-modal {
            width: 100%;
            padding: 1.1rem;
            background: var(--primary);
            border: none;
            border-radius: 18px;
            color: white;
            font-weight: 800;
            cursor: pointer;
            margin-top: 1rem;
        }

        /* App Layout */
        .app-container {
            width: 1400px;
            height: 90vh;
            background: var(--glass);
            backdrop-filter: blur(40px);
            border-radius: 50px;
            border: 1px solid var(--border);
            display: flex;
            overflow: hidden;
            position: relative;
            z-index: 10;
        }

        @media (max-width: 1000px) {
            .app-container {
                width: 100vw;
                height: 100vh;
                border-radius: 0;
            }
        }

        /* Sidebar */
        .sidebar {
            width: 400px;
            background: rgba(0, 0, 0, 0.2);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 50;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (max-width: 900px) {
            .sidebar {
                position: fixed;
                left: -100%;
                height: 100%;
                background: var(--surface);
                width: 320px;
                z-index: 1000;
            }

            .sidebar.active {
                left: 0;
                box-shadow: 30px 0 60px rgba(0, 0, 0, 0.5);
            }
        }

        .sidebar-header {
            padding: 3rem;
            border-bottom: 1px solid var(--border);
        }

        .list-section-title {
            font-size: 0.75rem;
            font-weight: 900;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 2rem 1.5rem 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .list-section-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .group-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 1.5rem 2rem;
        }

        .group-card {
            padding: 1.5rem;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.03);
            margin-bottom: 1rem;
            border: 1px solid transparent;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
        }

        .group-card:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-3px);
        }

        .group-card.active {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.15);
        }

        .owner-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: var(--secondary);
            font-size: 0.65rem;
            padding: 4px 10px;
            border-radius: 10px;
            font-weight: 900;
        }

        .joined-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            font-size: 0.65rem;
            padding: 4px 10px;
            border-radius: 10px;
            font-weight: 900;
        }

        /* Portal Area */
        .portal {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .portal-header {
            padding: 1.8rem 3rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-stream {
            flex: 1;
            padding: 3rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            scroll-behavior: smooth;
        }

        .bubble {
            max-width: 75%;
            padding: 1.2rem 1.8rem;
            border-radius: 26px;
            animation: enter 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            line-height: 1.5;
        }

        @keyframes enter {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
        }

        .bubble.sent {
            align-self: flex-end;
            background: var(--primary);
            border-bottom-right-radius: 4px;
            box-shadow: 0 10px 30px var(--primary-glow);
        }

        .bubble.received {
            align-self: flex-start;
            background: var(--surface);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border);
        }

        .sender-name {
            font-size: 0.8rem;
            font-weight: 900;
            color: var(--secondary);
            margin-bottom: 0.5rem;
        }

        /* Input Region */
        .input-region {
            padding: 2.5rem 3.5rem;
            display: flex;
            gap: 1.2rem;
            background: rgba(0, 0, 0, 0.25);
            border-top: 1px solid var(--border);
            position: relative;
            z-index: 20;
        }

        .input-region input {
            flex: 1;
            padding: 1.5rem 2rem;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 25px;
            color: white;
            font-size: 1.1rem;
            transition: 0.3s;
            outline: none;
            pointer-events: auto !important;
            position: relative;
            z-index: 30;
        }

        .input-region input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 40px var(--primary-glow);
        }

        .btn-send {
            padding: 0 3.5rem;
            background: var(--primary);
            border: none;
            border-radius: 25px;
            color: white;
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-send:hover {
            transform: scale(1.05);
            filter: brightness(1.2);
        }

        .mobile-toggle {
            display: none;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            padding: 0.5rem;
        }

        @media (max-width: 900px) {
            .mobile-toggle {
                display: block;
            }
        }

        .scrim {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            z-index: 900;
        }

        .scrim.active {
            display: block;
        }
    </style>
</head>

<body>
    <div class="scrim" id="globalScrim" onclick="nexus.toggleSidebar(false)"></div>

    <!-- Modals -->
    <div class="modal-overlay" id="forgeModal">
        <div class="modal">
            <h2>Forge Realm</h2>
            <input type="text" id="gNameIn" placeholder="Identity Handle..." autocomplete="off">
            <div style="display: flex; gap: 0.8rem; margin-bottom: 1.5rem;">
                <button id="pubBtn"
                    style="flex:1; padding:1rem; border-radius:15px; background:var(--primary); color:white; border:none; font-weight:800; cursor:pointer;"
                    onclick="nexus.setPrivate(false)">Public</button>
                <button id="privBtn"
                    style="flex:1; padding:1rem; border-radius:15px; background:transparent; color:white; border:1px solid var(--border); font-weight:800; cursor:pointer;"
                    onclick="nexus.setPrivate(true)">Private</button>
            </div>
            <input type="password" id="gPassIn" placeholder="Secret Key (Optional)..." style="display:none;">
            <div style="display: flex; gap: 1rem;">
                <button class="btn-modal" style="background:transparent; border:1px solid var(--border);"
                    onclick="nexus.toggleModal('forgeModal', false)">Cancel</button>
                <button class="btn-modal" onclick="nexus.submitForge()">Forge</button>
            </div>
        </div>
    </div>

    <!-- Sync Modal -->
    <div class="modal-overlay" id="syncModal">
        <div class="modal">
            <h2>Synchronize Realm</h2>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.9rem;">Target a remote frequency by
                its identity handle.</p>
            <input type="text" id="syncNameIn" placeholder="Realm Identity Name..." autocomplete="off">
            <input type="password" id="syncPassIn" placeholder="Secret Key (If Required)..." autocomplete="off">
            <div style="display: flex; gap: 1rem;">
                <button class="btn-modal" style="background:transparent; border:1px solid var(--border);"
                    onclick="nexus.toggleModal('syncModal', false)">Cancel</button>
                <button class="btn-modal" onclick="nexus.submitSync()">Synchronize</button>
            </div>
        </div>
    </div>

    <!-- Password Required Modal -->
    <div class="modal-overlay" id="passModal">
        <div class="modal">
            <h2>Secure Frequency</h2>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.9rem;">This realm is key-protected.
                Enter secret key to access.</p>
            <input type="password" id="entryPassIn" placeholder="Secret Key..." autocomplete="off">
            <input type="hidden" id="entryTargetIn">
            <div style="display: flex; gap: 1rem;">
                <button class="btn-modal" style="background:transparent; border:1px solid var(--border);"
                    onclick="nexus.toggleModal('passModal', false)">Deny</button>
                <button class="btn-modal" onclick="nexus.submitEntry()">Access</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <h2>Modify Identity</h2>
            <input type="text" id="eNameIn" placeholder="New identity handle..." autocomplete="off">
            <div style="display: flex; gap: 1rem;">
                <button class="btn-modal" style="background:transparent; border:1px solid var(--border);"
                    onclick="nexus.toggleModal('editModal', false)">Cancel</button>
                <button class="btn-modal" onclick="nexus.submitEdit()">Update</button>
            </div>
        </div>
    </div>

    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2.5rem;">
                    <h1 style="font-size: 2rem; font-weight: 900; letter-spacing: -1px;">Nexus Hub</h1>
                    <a href="Landing.html"
                        style="color:var(--primary); text-decoration:none; font-weight:900; font-size: 0.8rem;">HOME</a>
                </div>
                <button class="btn-modal" style="margin-top: 0;" onclick="nexus.toggleModal('forgeModal', true)">Forge
                    Realm</button>
                <button onclick="nexus.toggleModal('syncModal', true)"
                    style="width:100%; background:transparent; border:1px solid var(--border); color:white; padding:1rem; border-radius:18px; font-weight:800; cursor:pointer; margin-top: 0.8rem;">Sync
                    by Identity</button>
            </div>

            <div class="list-section-title">Public Realms</div>
            <div class="group-list" id="publicListArea"></div>

            <div class="list-section-title">Private Realms</div>
            <div class="group-list" id="privateListArea" style="flex: unset; min-height: 150px;"></div>
        </aside>

        <main class="portal">
            <header class="portal-header">
                <div style="display: flex; align-items: center; gap: 1.5rem;">
                    <button class="mobile-toggle" onclick="nexus.toggleSidebar(true)">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <div>
                        <h2 id="currentName" style="font-weight: 900; font-size: 1.6rem;">Nexus Realm</h2>
                        <p style="font-size: 0.75rem; color: var(--primary); font-weight: 950; letter-spacing: 1px;">
                            SYNCHRONIZED READY</p>
                    </div>
                </div>
                <button onclick="nexus.openEdit()"
                    style="background:none; border:none; color:var(--text-muted); font-weight:800; cursor:pointer;">Settings</button>
            </header>

            <div class="chat-stream" id="msgArea"></div>

            <footer class="input-region">
                <input type="text" id="mInput" placeholder="Write a message to broadcast..." autocomplete="off">
                <button class="btn-send" onclick="nexus.pulse()">PULSE</button>
            </footer>
        </main>
    </div>

    <script>
        class NexusLogic {
            constructor() {
                this.conn = null;
                this.user = localStorage.getItem('chatUsername') || ('User_' + Math.floor(Math.random() * 1000));
                this.activeRoom = null;
                this.isPriv = false;
                this.init();
            }

            init() {
                this.connect();
                document.getElementById('mInput').addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') this.pulse();
                });

                window.addEventListener('load', () => {
                    document.getElementById('mInput').focus();
                });
            }

            connect() {
                this.conn = new signalR.HubConnectionBuilder().withUrl("/chat").withAutomaticReconnect().build();
                this.conn.on("GroupsUpdated", () => this.refresh());

                // 🔥 CRITICAL FIX: Verify the room identity before drawing to prevent leaks
                this.conn.on("ReceiveMessageFromGroup", (m, s, room) => {
                    if (room === this.activeRoom) {
                        this.draw(s, m);
                    }
                });

                this.conn.on("NewMemberJoin", (u, r) => {
                    if (this.activeRoom === r) this.log(`✨ ${u} joined the realm.`);
                });
                this.conn.start().then(() => {
                    this.conn.invoke("RegisterUser", this.user);
                    this.refresh();
                });
            }

            async refresh() {
                if (this.conn.state !== 'Connected') return;
                const realms = await this.conn.invoke("GetPublicGroups", this.user);

                const pubArea = document.getElementById('publicListArea');
                const priArea = document.getElementById('privateListArea');
                pubArea.innerHTML = '';
                priArea.innerHTML = '';

                realms.forEach(r => {
                    const el = document.createElement('div');
                    el.className = `group-card ${this.activeRoom === r.name ? 'active' : ''}`;
                    el.onclick = () => { this.join(r.name); this.toggleSidebar(false); };
                    const isCreator = r.creator === this.user;

                    el.innerHTML = `
                        <h3>${r.name}</h3>
                        <p>${r.memberCount} Nodes | ${r.isPrivate ? 'PRIVATE' : 'PUBLIC'}</p>
                        ${isCreator ? '<div class="owner-badge">YOU</div>' : ''}
                    `;

                    // 🔥 Logically separate Private/Owned groups from general Public ones
                    if (r.isPrivate || isCreator) {
                        priArea.appendChild(el);
                    } else {
                        pubArea.appendChild(el);
                    }
                });
            }

            join(name, pass = null) {
                this.conn.invoke("JoinGroup", name, this.user, pass).then(() => {
                    this.activeRoom = name;
                    document.getElementById('currentName').textContent = name;
                    document.getElementById('msgArea').innerHTML = '';
                    this.refresh();
                    this.toggleModal('passModal', false);
                    setTimeout(() => document.getElementById('mInput').focus(), 150);
                }).catch(() => {
                    document.getElementById('entryTargetIn').value = name;
                    this.toggleModal('passModal', true);
                });
            }

            submitSync() {
                const name = document.getElementById('syncNameIn').value.trim();
                const pass = document.getElementById('syncPassIn').value.trim();
                if (!name) return;
                this.join(name, pass);
                this.toggleModal('syncModal', false);
                document.getElementById('syncNameIn').value = '';
                document.getElementById('syncPassIn').value = '';
            }

            submitEntry() {
                const name = document.getElementById('entryTargetIn').value;
                const pass = document.getElementById('entryPassIn').value.trim();
                if (!pass) return;
                this.join(name, pass);
                document.getElementById('entryPassIn').value = '';
            }

            pulse() {
                const el = document.getElementById('mInput');
                const val = el.value.trim();
                if (!val || !this.activeRoom || this.conn.state !== 'Connected') return;
                this.conn.invoke("SendMessageToGroup", this.activeRoom, this.user, val);
                el.value = '';
                el.focus();
            }

            draw(s, m) {
                const area = document.getElementById('msgArea');
                const isMe = s === this.user;
                area.insertAdjacentHTML('beforeend', `
                    <div class="bubble ${isMe ? 'sent' : 'received'}">
                        ${!isMe ? `<div class="sender-name">${s}</div>` : ''}
                        <div>${m}</div>
                    </div>
                `);
                area.scrollTop = area.scrollHeight;
            }

            log(txt) {
                document.getElementById('msgArea').insertAdjacentHTML('beforeend', `
                    <div style="text-align:center; color:var(--primary); font-size:0.75rem; padding:1.5rem; font-weight:900;">${txt}</div>
                `);
            }

            toggleModal(id, show) {
                const el = document.getElementById(id);
                if (el) {
                    el.classList.toggle('active', show);
                    if (!show) {
                        setTimeout(() => document.getElementById('mInput').focus(), 100);
                    } else {
                        const input = el.querySelector('input');
                        if (input) setTimeout(() => input.focus(), 100);
                    }
                }
            }

            setPrivate(val) {
                this.isPriv = val;
                document.getElementById('pubBtn').style.background = val ? 'transparent' : 'var(--primary)';
                document.getElementById('privBtn').style.background = val ? 'var(--primary)' : 'transparent';
                document.getElementById('gPassIn').style.display = val ? 'block' : 'none';
            }

            submitForge() {
                const n = document.getElementById('gNameIn').value.trim();
                const p = document.getElementById('gPassIn').value.trim();
                if (!n) return;
                this.conn.invoke("CreateGroup", n, this.user, this.isPriv, p).then(() => {
                    this.toggleModal('forgeModal', false);
                    this.join(n, p);
                });
            }

            openEdit() {
                if (!this.activeRoom) return;
                document.getElementById('eNameIn').value = this.activeRoom;
                this.toggleModal('editModal', true);
            }

            submitEdit() {
                const n = document.getElementById('eNameIn').value.trim();
                if (!n || n === this.activeRoom) return;
                this.conn.invoke("UpdateGroupName", this.activeRoom, n, this.user).then(() => this.toggleModal('editModal', false));
            }

            toggleSidebar(val) {
                document.getElementById('sidebar').classList.toggle('active', val);
                document.getElementById('globalScrim').classList.toggle('active', val);
            }
        }
        window.nexus = new NexusLogic();
    </script>
</body>

</html>
